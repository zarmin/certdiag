protocols = imap pop3
ssl = yes
ssl_cert = </certs/server.crt
ssl_key = </certs/server.key
ssl_min_protocol = TLSv1
disable_plaintext_auth = no
mail_location = mbox:~/mail:INBOX=/var/mail/%u
passdb {
    driver = static
    args = password=testpass
}
userdb {
    driver = static
    args = uid=vmail gid=vmail home=/home/vmail
}
