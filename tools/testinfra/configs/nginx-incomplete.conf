worker_processes 1;
events { worker_connections 64; }
http {
    server {
        listen 443 ssl;
        server_name localhost;
        # Only serve leaf cert, no intermediate -- triggers incomplete chain detection
        ssl_certificate /certs/leafonly.crt;
        ssl_certificate_key /certs/leafonly.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        location / {
            return 200 '{"status":"ok","server":"incomplete"}';
            add_header Content-Type application/json;
        }
    }
}
