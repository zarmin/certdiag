worker_processes 1;
events { worker_connections 64; }
http {
    server {
        listen 443 ssl;
        server_name localhost;
        ssl_certificate /certs/revocable-revoked-chain.crt;
        ssl_certificate_key /certs/revocable-revoked.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        location / {
            return 200 '{"status":"ok","server":"revocable-revoked"}';
            add_header Content-Type application/json;
        }
    }
}
