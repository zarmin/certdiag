kind: smoketest-inventory
version: "1"
description: >
  Inventory of all smoketest certificates and keystores.
  Generated by generate_certs.sh into certs/ directory.
  Master key for encrypted passwords: smoketest-master-key

ca_hierarchy:
  root_ca:
    algorithm: RSA 4096
    validity: 10 years
    subject: "C=US, ST=California, O=Smoketest Root CA, CN=Root CA"
    self_signed: true
  intermediate_ca:
    algorithm: RSA 2048
    validity: 5 years
    subject: "C=US, ST=California, O=Smoketest Intermediate CA, CN=Intermediate CA"
    signed_by: root_ca
  leaf:
    algorithm: RSA 2048
    validity: 1 year
    subject: "C=US, ST=California, L=San Francisco, O=Smoketest Corp, CN=leaf.smoketest.example.com"
    signed_by: intermediate_ca
    san:
      - leaf.smoketest.example.com
      - www.smoketest.example.com

files:
  # ---- PEM ----
  - filename: self-signed-rsa.crt
    format: PEM
    contents: single self-signed X.509 certificate
    algorithm: RSA 2048
    cn: self-signed.smoketest.example.com
    password: ~
    expected_entries: 1

  - filename: self-signed-rsa.key
    format: PEM
    contents: unencrypted RSA private key
    algorithm: RSA 2048
    password: ~
    expected_entries: 1

  - filename: ca-chain.pem
    format: PEM
    contents: concatenated certificate chain (leaf + intermediate + root)
    certs_in_chain: 3
    password: ~
    expected_entries: 3

  - filename: encrypted-key.crt
    format: PEM
    contents: X.509 certificate for encrypted key pair
    algorithm: RSA 2048
    cn: encrypted.smoketest.example.com
    password: ~
    expected_entries: 1

  - filename: encrypted-key.key
    format: PEM
    contents: AES-256 encrypted RSA private key
    algorithm: RSA 2048
    password: keypass123
    password_resolution: by_filename glob (encrypted-key.*)
    expected_entries: 1

  - filename: ecdsa-p256.crt
    format: PEM
    contents: ECDSA P-256 self-signed certificate
    algorithm: ECDSA P-256
    cn: ecdsa.smoketest.example.com
    password: ~
    expected_entries: 1

  - filename: ecdsa-p256.key
    format: PEM
    contents: unencrypted ECDSA P-256 private key
    algorithm: ECDSA P-256
    password: ~
    expected_entries: 1

  - filename: combined-bundle.pem
    format: PEM
    contents: certificate + private key in one file (cert+key bundle)
    note: should trigger blue filename color in certdiag output
    algorithm: RSA 2048
    password: ~
    expected_entries: 2

  - filename: csr-request.csr
    format: PEM
    contents: certificate signing request
    algorithm: RSA 2048
    cn: csr.smoketest.example.com
    password: ~
    expected_entries: 1

  # ---- DER ----
  - filename: rsa-cert.der
    format: DER
    contents: DER-encoded X.509 certificate
    algorithm: RSA 2048
    cn: der-rsa.smoketest.example.com
    password: ~
    expected_entries: 1

  - filename: rsa-key.der
    format: DER
    contents: DER-encoded RSA private key
    algorithm: RSA 2048
    password: ~
    expected_entries: 1

  - filename: ecdsa-cert.der
    format: DER
    contents: DER-encoded ECDSA P-256 certificate
    algorithm: ECDSA P-256
    cn: ecdsa.smoketest.example.com
    password: ~
    expected_entries: 1

  - filename: request.csr.der
    format: DER
    contents: DER-encoded certificate signing request
    algorithm: RSA 2048
    cn: csr.smoketest.example.com
    password: ~
    expected_entries: 1

  # ---- PKCS#12 ----
  - filename: standard.p12
    format: PKCS12
    contents: single certificate + private key
    algorithm: RSA 2048
    cn: standard.smoketest.example.com
    password: p12pass
    password_resolution: common_plaintext
    expected_entries: 1

  - filename: with-chain.p12
    format: PKCS12
    contents: leaf certificate + private key + full CA chain (intermediate + root)
    algorithm: RSA 2048
    cn: leaf.smoketest.example.com
    password: chainpass
    password_resolution: by_filename glob (with-chain.*)
    expected_entries: 3

  - filename: ecdsa.pfx
    format: PKCS12
    extension: .pfx
    contents: ECDSA certificate + private key
    algorithm: ECDSA P-256
    cn: ecdsa.smoketest.example.com
    password: ecdsapfx
    password_resolution: by_filename glob (*.pfx)
    expected_entries: 1

  - filename: wrong-password.p12
    format: PKCS12
    contents: certificate + private key with unknown password
    algorithm: RSA 2048
    cn: wrong-password.smoketest.example.com
    password: unknownpass123
    password_resolution: NOT_IN_CONFIG
    note: should show decryption error in certdiag output
    expected_entries: 0

  - filename: empty-password.p12
    format: PKCS12
    contents: certificate + private key with empty password
    algorithm: RSA 2048
    cn: empty-password.smoketest.example.com
    password: ""
    password_resolution: common_plaintext (empty string)
    expected_entries: 1

  - filename: legacy-des3.p12
    format: PKCS12
    contents: certificate + private key using legacy 3DES encryption
    algorithm: RSA 2048
    cn: legacy.smoketest.example.com
    encryption: PBE-SHA1-3DES
    password: legacydes
    password_resolution: common_encrypted
    expected_entries: 1

  # ---- PKCS#7 ----
  - filename: single.p7b
    format: PKCS7
    encoding: DER
    contents: single leaf certificate
    cn: leaf.smoketest.example.com
    password: ~
    expected_entries: 1

  - filename: chain.p7b
    format: PKCS7
    encoding: DER
    contents: full certificate chain (leaf + intermediate + root)
    certs_in_chain: 3
    password: ~
    expected_entries: 3

  - filename: pem-encoded.p7b
    format: PKCS7
    encoding: PEM
    contents: single leaf certificate, PEM-encoded PKCS#7
    cn: leaf.smoketest.example.com
    password: ~
    expected_entries: 1

  - filename: bundle.p7c
    format: PKCS7
    extension: .p7c
    encoding: DER
    contents: two unrelated self-signed certificates
    password: ~
    expected_entries: 2

  # ---- JKS ----
  - filename: keystore.jks
    format: JKS
    contents: single RSA key pair entry
    algorithm: RSA 2048
    cn: jks.smoketest.example.com
    aliases:
      - smoketest-rsa
    password: changeit
    password_resolution: common_plaintext
    expected_entries: 1

  - filename: multi.jks
    format: JKS
    contents: two RSA key pair entries
    algorithm: RSA 2048
    aliases:
      - web-entry
      - api-entry
    password: multientry
    password_resolution: common_plaintext
    expected_entries: 2

  - filename: truststore.jks
    format: JKS
    contents: trusted CA certificates only (root + intermediate)
    aliases:
      - root-ca
      - intermediate-ca
    password: trustme
    password_resolution: common_plaintext
    expected_entries: 2

  - filename: wrong-password.jks
    format: JKS
    contents: single RSA key pair with unknown password
    algorithm: RSA 2048
    cn: unknown.smoketest.example.com
    password: unknownjks
    password_resolution: NOT_IN_CONFIG
    note: should show decryption error in certdiag output
    expected_entries: 0

  # ---- JCEKS ----
  - filename: keystore.jceks
    format: JCEKS
    contents: single RSA key pair entry
    algorithm: RSA 2048
    cn: jceks.smoketest.example.com
    aliases:
      - jceks-rsa
    password: jcekspass
    password_resolution: by_filename filepath (keystore.jceks)
    expected_entries: 1

  - filename: secret-keys.jceks
    format: JCEKS
    contents: symmetric secret keys (AES-256 + DES)
    aliases:
      - aes-key
      - des-key
    password: secretpass
    password_resolution: common_plaintext
    expected_entries: 2

  - filename: mixed.jceks
    format: JCEKS
    contents: RSA key pair + AES-256 secret key
    aliases:
      - mixed-rsa
      - mixed-aes
    password: mixedpass
    password_resolution: common_plaintext
    expected_entries: 2

  - filename: truststore.jceks
    format: JCEKS
    contents: trusted root CA certificate
    aliases:
      - root-ca
    password: trustjceks
    password_resolution: common_encrypted
    expected_entries: 1

  # ---- Other ----
  - filename: passwords.txt
    format: text
    contents: password file for -P flag testing
    passwords_contained:
      - p12pass
      - changeit

password_resolution_coverage:
  - path: by_filename (glob + plaintext_password)
    password: ecdsapfx
    unlocks: ecdsa.pfx

  - path: by_filename (glob + plaintext_password)
    password: chainpass
    unlocks: with-chain.p12

  - path: by_filename (filepath + plaintext_password)
    password: jcekspass
    unlocks: keystore.jceks

  - path: by_filename (glob + encrypted_password)
    password: keypass123
    unlocks: encrypted-key.key

  - path: common_plaintext
    passwords: [changeit, p12pass, multientry, trustme, secretpass, mixedpass, ""]
    unlocks: [keystore.jks, standard.p12, multi.jks, truststore.jks, secret-keys.jceks, mixed.jceks, empty-password.p12]

  - path: common_encrypted
    passwords: [legacydes, trustjceks]
    unlocks: [legacy-des3.p12, truststore.jceks]

  - path: env var (CERTDIAG_PASSWORD_*)
    passwords: [p12pass, ecdsapfx]
    note: duplicate coverage set via wrapper script

  - path: password file (-P)
    passwords: [p12pass, changeit]
    note: tested via wrapper args with passwords.txt

  - path: NOT_IN_CONFIG (should fail)
    passwords: [unknownpass123, unknownjks]
    files: [wrong-password.p12, wrong-password.jks]
    note: these should show decryption errors
